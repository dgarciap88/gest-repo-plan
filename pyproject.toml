[project]
name = "gestplan"
version = "0.1.0"
description = "Motor local de planes de procesos como grafos"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "gestplan[api]",
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
gestplan = "gestplan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/gestplan/catalog_docs.py" = ["E501"]
